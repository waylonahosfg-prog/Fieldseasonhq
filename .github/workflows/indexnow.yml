name: Submit Sitemap URLs to IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'src/pages/**'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Wait 45s for Vercel deployment
        run: sleep 45
      - name: Ping IndexNow API
        run: node scripts/submit-indexnow.mjs
